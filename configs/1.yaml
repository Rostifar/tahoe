vocab: ./data/vocab.json
train_set: ./data/train.bin
val_set: ./data/val.bin

batch_size: 32
context_length: 512
num_layers: 6
d_model: 384
num_heads: 6
d_ff: 1536
theta: 10000.0

device: cuda
dtype: fp16

lr_max: 3e-4
lr_min: 1e-5
t_warmup: 1000
t_cos: 50000

betas: [0.99, 0.999]
weight_decay: 0.01
max_grad: 1.0

ckpt_iter: 5000
ckpt_path: ./checkpoints
from_ckpt: null
