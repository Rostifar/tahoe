data:
  vocab: ./data/tokenizers/tsv2-bpe
  train_set: ./data/TinyStoriesV2-GPT4-train.npy
  val_set: ./data/TinyStoriesV2-GPT4-valid.npy

experiments:
  tiny_stories_no_scheduler_1e_4:
    vocab_size: 10000
    batch_size: 32
    context_length: 256
    num_layers: 4
    d_model: 512
    num_heads: 16
    d_ff: 1344
    theta: 10000.0

    device: cuda
    dtype: fp32
    scheduler: null
    optimizer:
      lr: 0.0003
      betas: [0.99, 0.999]
      weight_decay: 0.01
    max_grad: 1.0

    ckpt_iter: 500
    val_iter: 250
    ckpt_path: ./checkpoints
    from_ckpt: null
    max_iter: 5000
